# Production compose cho VM ai-law dùng chung.
# KHÁC với docker-compose.yml gốc: KHÔNG có service proxy (host Caddy lo TLS/proxy),
# web publish ra 127.0.0.1:3001 (8000 đã bị ai-law dùng), db chỉ nội bộ (0 xung đột).
# Ảnh upload nằm trong volume uploads_data mount vào /app/uploads (bỏ service `storage` 17/9).
name: khupho
services:
  web:
    build:
      context: .
      args:
        # Đọc từ .env (như docker-compose.yml) — KHÔNG hardcode. basePath là BUILD ARG:
        # deploy dưới subpath (fpt.vn/khu-pho-biet-thuong) mà file này chốt cứng "" thì
        # CI build lại là mất subpath, site 404 toàn bộ asset. Bỏ trống = domain riêng.
        BASE_PATH: ${BASE_PATH:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-khupho}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-khupho}
      # Ghi đè giá trị trong .env (dev ngoài Docker đặt ./uploads) — trong container luôn là
      # thư mục đã mount volume ở dưới.
      UPLOAD_DIR: /app/uploads
    volumes:
      # Ảnh upload (từ 17/9). Volume mới được Docker chép quyền từ image nên
      # thuộc UID/GID cố định 1001 của app. Production Kubernetes mount PVC NFS vào đây.
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:3001:3000"   # chỉ host Caddy truy cập, không lộ ra ngoài
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-khupho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-khupho}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-khupho} -d ${POSTGRES_DB:-khupho}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    # KHÔNG publish port — tách hoàn toàn khỏi postgres của ai-law (5432)

volumes:
  db_data:
  uploads_data:

networks:
  internal:
    driver: bridge
