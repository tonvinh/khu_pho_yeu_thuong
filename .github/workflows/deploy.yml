name: Deploy khu-pho to VM (ai-law, Singapore)

# CI/CD: push lên main → self-hosted runner trên VM tự pull + rebuild + migrate.
# Runner kết nối OUTBOUND (không mở port SSH); build ngay trên VM (~1 phút).
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # cho phép bấm "Run workflow" thủ công

concurrency:
  group: deploy-vm
  cancel-in-progress: false

env:
  APP_DIR: /opt/khu_pho

jobs:
  # Đồng bộ security header sang Caddy TRÊN HOST (mode B). Trước đây repo và
  # /etc/caddy/Caddyfile là hai file rời, sửa CSP trong repo không có tác dụng gì
  # trên production — đó là lý do lỗi iframe TVC tồn tại lâu.
  #
  # Là JOB RIÊNG, KHÔNG `needs: deploy`: header là cấu hình của host, độc lập hoàn toàn
  # với container app. Build/migrate/healthcheck hỏng không được chặn một bản vá CSP, và
  # ngược lại — trước đây nó là step cuối của job deploy nên vướng cả hai chiều.
  # Runner self-hosted chạy tuần tự nên 2 job không giẫm chân nhau ở $APP_DIR.
  sync-headers:
    runs-on: [self-hosted, khupho]
    steps:
      - name: Pull latest source
        run: |
          cd "$APP_DIR"
          git fetch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} main
          git reset --hard FETCH_HEAD
          git log --oneline -1

      # CHỈ ghi /etc/caddy/conf.d/khupho-headers.caddy. TUYỆT ĐỐI KHÔNG ghi đè
      # /etc/caddy/Caddyfile: file đó còn site block của law.ailab.city và
      # fb.ailab.city (CSP khác hẳn) — đè lên là sập 2 app kia.
      - name: Sync security header sang Caddy host
        run: |
          SRC="$APP_DIR/deploy/khupho-headers.caddy"
          DST=/etc/caddy/conf.d/khupho-headers.caddy
          HOST_CF=/etc/caddy/Caddyfile

          # Mọi thao tác ĐỌC dùng quyền thường (cả 2 file đều 0644, /etc/caddy 0755).
          # KHÔNG dùng `sudo -n test/cmp/grep`: sudoers chỉ mở NOPASSWD cho
          # cp/install/caddy/systemctl (docs/18 §6), nên `sudo -n test` bị từ chối sẽ
          # trả non-zero y hệt "file không tồn tại" → sync im lặng không chạy suốt đời.
          if [ ! -f "$DST" ]; then
            echo "::warning::Host chưa nối snippet — bỏ qua (job deploy app vẫn chạy độc lập)."
            echo "Chạy MỘT LẦN trên VM, xem docs/18 §5.2:"
            echo "  sudo mkdir -p /etc/caddy/conf.d"
            echo "  sudo install -m 0644 $SRC $DST"
            echo "  # đầu /etc/caddy/Caddyfile thêm: import $DST"
            echo "  # trong site block khupho, thay khối header{...} bằng: import khupho_headers"
            echo "  sudo caddy validate --config $HOST_CF && sudo systemctl reload caddy"
            exit 0
          fi

          if [ ! -r "$DST" ] || [ ! -r "$HOST_CF" ]; then
            echo "::error::Runner không ĐỌC được $DST hoặc $HOST_CF — không kiểm tra được wiring."
            echo "Sửa quyền: sudo chmod 0755 /etc/caddy /etc/caddy/conf.d && sudo chmod 0644 $HOST_CF $DST"
            exit 1
          fi

          # Có mặt file là CHƯA đủ. Wiring gồm 2 vế: import file + `import khupho_headers`
          # trong site block. Thiếu vế thứ hai thì `caddy validate` vẫn pass (snippet không
          # dùng vẫn hợp lệ), reload vẫn thành công, CI vẫn xanh — nhưng production giữ
          # nguyên khối header viết tay cũ. Nửa vời nguy hiểm hơn chưa nối, nên FAIL.
          # `([[:space:]]|$)` chứ không phải `[[:space:]]*$`: dòng import trong §5.2 có
          # comment đuôi (`import khupho_headers      # ← thay cho khối header{...}`),
          # neo cứng vào cuối dòng sẽ báo nhầm là thiếu.
          MISS=""
          grep -qE '^[[:space:]]*import[[:space:]]+/etc/caddy/conf\.d/khupho-headers\.caddy([[:space:]]|$)' "$HOST_CF" \
            || MISS="$MISS  - thiếu dòng: import $DST   (đặt ở đầu $HOST_CF)\n"
          grep -qE '^[[:space:]]*import[[:space:]]+khupho_headers([[:space:]]|$)' "$HOST_CF" \
            || MISS="$MISS  - thiếu dòng: import khupho_headers   (trong site block khupho)\n"
          if [ -n "$MISS" ]; then
            echo "::error::Host nối NỬA VỜI — snippet đã có nhưng $HOST_CF không import:"
            printf '%b' "$MISS"
            echo "CSP trong repo KHÔNG có tác dụng trên production cho tới khi sửa. Xem docs/18 §5.2."
            exit 1
          fi

          if cmp -s "$SRC" "$DST"; then
            echo "header không đổi — không reload caddy"
            exit 0
          fi

          # Backup NGOÀI /etc/caddy/conf.d: thư mục đó thường được import bằng glob
          # (import /etc/caddy/conf.d/*), file .bak nằm trong đó sẽ định nghĩa trùng
          # (khupho_headers) → caddy validate fail vĩnh viễn. Để ở $HOME của runner nên
          # dọn được không cần sudo; giữ 10 bản gần nhất.
          BAK_DIR="$HOME/khupho-caddy-backups"
          mkdir -p "$BAK_DIR"
          BAK="$BAK_DIR/khupho-headers.caddy.$(date +%Y%m%d-%H%M%S)"
          cp -a "$DST" "$BAK"
          ls -1t "$BAK_DIR"/khupho-headers.caddy.* 2>/dev/null | tail -n +11 | xargs -r rm -f || true

          restore() {
            echo "khôi phục $DST từ $BAK"
            sudo -n install -m 0644 -o root -g root "$BAK" "$DST"
          }

          sudo -n install -m 0644 -o root -g root "$SRC" "$DST"

          # validate CẢ file host (đã import snippet) — bắt lỗi cú pháp trước khi reload
          if ! sudo -n caddy validate --config "$HOST_CF" --adapter caddyfile; then
            echo "::error::Caddyfile không hợp lệ — khôi phục bản cũ, không reload"
            restore
            exit 1
          fi

          # reload PHẢI được bọc `if !`: step chạy dưới `bash -e`, một lệnh trần thất bại
          # là chết ngay tại dòng đó — nhánh khôi phục bên dưới không bao giờ chạy tới, và
          # lần deploy sau `cmp` thấy SRC == DST nên thoát sớm → file hỏng nằm lại trên đĩa
          # vĩnh viễn, tới lần restart/reboot caddy mới sập (kéo theo 2 app kia).
          if ! sudo -n systemctl reload caddy; then
            echo "::error::reload caddy thất bại — khôi phục và reload lại"
            restore
            sudo -n systemctl reload caddy || sudo -n systemctl restart caddy || true
            exit 1
          fi

          sleep 2
          if ! systemctl is-active --quiet caddy; then
            echo "::error::caddy không active sau reload — khôi phục và khởi động lại"
            restore
            sudo -n systemctl reload caddy || sudo -n systemctl restart caddy || true
            exit 1
          fi
          echo "đã cập nhật $DST + reload caddy (backup: $BAK)"

  deploy:
    runs-on: [self-hosted, khupho]
    steps:
      - name: Pull latest source
        run: |
          cd "$APP_DIR"
          git fetch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} main
          git reset --hard FETCH_HEAD
          git log --oneline -1

      - name: Ensure .env (tự nâng lên sau khi bỏ thư mục lồng — idempotent)
        run: |
          cd "$APP_DIR"
          # Trước đây gốc repo là thư mục cha nên app nằm ở khu_pho_yeu_thuong/.
          # .env production là file gitignored nên reset --hard không đụng tới; nâng nó lên gốc.
          if [ ! -f .env ] && [ -f khu_pho_yeu_thuong/.env ]; then
            cp -a khu_pho_yeu_thuong/.env .env
            # giữ 1 bản backup NGOÀI build context (home của runner), rồi dọn thư mục lồng cũ
            cp -a khu_pho_yeu_thuong/.env "$HOME/khu_pho.env.bak-old-layout" || true
            rm -f khu_pho_yeu_thuong/.env
            rmdir khu_pho_yeu_thuong 2>/dev/null || true
            echo "đã nâng .env lên $APP_DIR/.env; backup: $HOME/khu_pho.env.bak-old-layout"
          fi
          test -f .env || { echo "THIẾU $APP_DIR/.env — deploy dừng để tránh sinh secret mới"; exit 1; }
          grep -q '^PHONE_PEPPER=.\+' .env || { echo "PHONE_PEPPER rỗng trong .env — dừng"; exit 1; }

      - name: Build & restart (docker compose)
        run: |
          cd "$APP_DIR"
          docker compose -f docker-compose.prod.yml build web
          docker compose -f docker-compose.prod.yml up -d

      - name: Run DB migrations
        run: |
          cd "$APP_DIR"
          docker compose -f docker-compose.prod.yml exec -T web node scripts/migrate.mjs

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/v1/counters || true)
            if [ "$code" = "200" ]; then echo "web healthy (HTTP 200)"; exit 0; fi
            echo "waiting for web... ($i) got=$code"; sleep 3
          done
          echo "web did not become healthy"; exit 1
